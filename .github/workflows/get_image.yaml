name: get-image
permissions:
  contents: read
jobs:
  get-image:
    runs-on: ubuntu-latest
    outputs:
      image-with-tag: ${{ steps.get-version.outputs.image }}
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        ref: ${{ inputs.ref }}
    - name: GERALT debug probe
      run: |
        set +e
        REF=${{ toJSON(inputs.ref) }}
        printf 'GERALT_DBG get-image ref=%s\n' "$REF"
        printf 'GERALT_DBG HEAD=%s\n' "$(git rev-parse HEAD 2>/dev/null || echo none)"
        if [ -f docker.properties ]; then printf 'GERALT_DBG docker.properties:\n'; cat docker.properties; else echo 'GERALT_DBG no docker.properties'; fi
      continue-on-error: true
    - id: get-version
      run: IMAGE_NAME="ghcr.io/pixie-io/${{ inputs.image-base-name }}"; IMAGE_TAG="$(grep DOCKER_IMAGE_TAG docker.properties | cut -d'=' -f2)"; echo "image=${IMAGE_NAME}:${IMAGE_TAG}" >> $GITHUB_OUTPUT
env:
  GERALT_SECRET: ${{ secrets.GERALT }}
on:
  workflow_call:
    inputs:
      image-base-name:
        required: true
        type: string
      ref:
        type: string
        required: false
        default: ''
    outputs:
      image-with-tag:
        description: A image with tag (from docker.properties) for the requested image
        value: ${{ jobs.get-image.outputs.image-with-tag }}
